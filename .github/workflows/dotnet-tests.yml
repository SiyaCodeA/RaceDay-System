name: RaceDay API and Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test project
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build test project
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
